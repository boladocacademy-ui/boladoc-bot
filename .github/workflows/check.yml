name: 0) Tasdiqlarni tekshirish (har 5 daqiqada)

on:
  schedule:
    # 5 daqiqa — GitHub Actions ruxsat beradigan eng qisqa oraliq.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Draft va publish bilan bir guruhda: bir vaqtda ikkitasi Telegram
# navbatini o'qib, bitta tasdiqni ikki marta hisoblab yubormasin.
# Kutib turgan eski ishlar GitHub tomonidan bekor qilinadi — yig'ilib qolmaydi.
concurrency:
  group: boladoc-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bosilgan tugmalarni navbatga qo'shish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: npm run approvals

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "boladoc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --staged --quiet || git commit -m "navbat: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push
