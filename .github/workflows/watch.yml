name: 0) Uzluksiz kuzatuv (tugma bosilishini kutadi)

# GitHub qisqa oraliqli cronlarni deyarli bajarmaydi: 13-14 avgustda
# "har 15 daqiqada" cron 21 soatda ~84 ta o'rniga 5 marta ishga tushdi.
# Shuning uchun cronga tayanmaymiz: bitta ish uzoq turadi va Telegramni
# uzluksiz tinglaydi, cron esa faqat navbatdagisini boshlaydi.
#
# 17-avgust o'lchovi: soatlik cron + 55 daqiqalik ish YETARLI EMAS. 48 ta ish
# bajarilgan, lekin ishga tushish vaqtlari 2:47, 3:51, 4:44, 8:28, 10:54,
# 13:08 (GMT+5) — ya'ni orada 1.5-2.8 soatlik ko'r oynalar qolardi, chunki
# soatlik cronlarning yarmi bajarilmaydi. Qoplama ~40% edi.
#
# Yechim: har bir ish 2 soat 50 daqiqa turadi va 3 soatlik oynada IKKI marta
# cron qo'yiladi (1.5 soat farq bilan). Shunday qilib bittasi tashlansa ham
# ikkinchisi oynani yopadi, ish yiqilib qolsa esa o'rniga tezda yangisi keladi.
on:
  schedule:
    - cron: '9 */3 * * *'
    - cron: '39 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Draft/publish dan alohida guruh: uzoq turadigan kuzatuv ularni
# kutib qoldirmasligi kerak. Telegramni bir vaqtda ikkitasi o'qisa,
# Telegram 409 qaytaradi — watch.js buni ko'rib yo'l beradi.
concurrency:
  group: boladoc-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tugmalarni uzluksiz kutish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          WATCH_MINUTES: '170'
          WATCH_PUSH: '1'
        run: |
          git config user.name "boladoc-bot"
          git config user.email "bot@users.noreply.github.com"
          npm run watch
