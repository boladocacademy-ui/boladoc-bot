name: 1) Draft tayyorlash (21:00 Toshkent)

on:
  schedule:
    # 16:11 UTC = 21:11 Asia/Tashkent (UTC+5, yozgi vaqt o'zgarishi yo'q).
    # Aniq :00 emas: soatning boshi GitHub'da eng band daqiqa, jadval o'sha
    # yerda eng ko'p kechikadi.
    - cron: '11 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boladoc-bot
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # resvg tizim shriftlaridan foydalanadi — ular bo'lmasa rasmda matn chiqmaydi.
      - name: Shriftlarni o'rnatish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu fonts-dejavu-extra

      - name: Bog'liqliklar
        run: npm install --no-audit --no-fund

      - name: Draftni tayyorlab adminga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run draft

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "boladoc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --staged --quiet || git commit -m "draft: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
