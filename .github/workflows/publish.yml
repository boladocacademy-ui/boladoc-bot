name: 2) Kanalga chiqarish (08:00 Toshkent)

on:
  schedule:
    # 02:07 UTC da boshlanadi, skript aniq 03:00 UTC = 08:00 Toshkent gacha kutadi.
    - cron: '07 2 * * *'
    # Zaxira urinishlar: GitHub jadvali soatlab kechikishi mumkin. Qaysi biri
    # birinchi ishga tushsa — o'sha chiqaradi, qolganlari queue.handledOn
    # tufayli hech narsa qilmaydi. Ya'ni bir kunda baribir bitta post.
    - cron: '13 3 * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boladoc-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bog'liqliklar
        run: npm install --no-audit --no-fund

      - name: Tasdiqni tekshirib kanalga chiqarish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: npm run publish

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "boladoc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --staged --quiet || git commit -m "publish: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
